[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scope-time-state"
version = "0.1.0"
description = "Scope-Time-State memory construction and retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "aiohttp>=3.8",
  "dateparser>=1.2",
  "json-repair>=0.28",
  "networkx>=3.0",
  "nltk>=3.8",
  "numpy>=1.24",
  "openai>=1.0",
  "pandas>=2.0",
  "pyarrow>=15.0",
  "pydantic>=2.7.1",
  "python-dotenv>=1.0",
  "rank-bm25>=0.2.2",
  "requests>=2.28",
  "rich>=13.0",
]

[project.scripts]
sts = "sts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
